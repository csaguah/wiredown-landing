# Workflow oficial de Astro para GitHub Pages (docs.astro.build/en/guides/deploy/github/).
# Único cambio: build-cmd corre `npm test`, que hace `astro build` (pretest) y luego los tests;
# si un test falla, no se publica. Requiere Settings → Pages → Source: GitHub Actions.
#
# schedule: build diario de main para que un artículo con publishDate futura salga solo ese día
# (src/lib/blog-rules.mjs publica según la fecha del build en America/Santiago). 09:17 UTC =
# 06:17 en Chile en horario de verano (05:17 en invierno; la fecha sigue siendo la del mismo día).
# GitHub puede atrasar unos minutos los cron y los desactiva tras 60 días sin actividad en el repo.
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, test and upload your site
        uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: npm test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
